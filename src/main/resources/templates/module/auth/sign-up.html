<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Đăng ký - Grocery Store')}"></head>
<link rel="stylesheet" th:href="@{/assets/css/auth.css}"/>

<body>
<!-- main -->
<main class="auth">
    <!-- auth intro -->
    <div class="auth__intro">
        <!-- logo -->
        <a th:href="@{/}" class="logo d-none d-md-flex">
            <img
                    th:src="@{/assets/icon/logo.svg}"
                    alt="grocerystore"
                    class="logo__img"
            />
            <h1 class="logo__title">grocerystore</h1>
        </a>

        <div class="auth__intro-main">
            <img
                    th:src="@{/assets/img/auth/intro.svg}"
                    alt=""
                    class="auth__intro-img"
            />
            <p class="auth__intro-text">
                Giá trị thương hiệu cao cấp, sản phẩm chất lượng và dịch vụ sáng tạo.
            </p>
        </div>

        <button
                class="auth__intro-next d-none d-md-block js-toggle"
                toggle-target="#auth-content"
        >
            <img th:src="@{/assets/icon/next.svg}" alt=""/>
        </button>
    </div>

    <!-- auth content -->
    <div id="auth-content" class="auth__content hide">
        <div class="auth__content-inner">
            <!-- logo -->
            <a th:href="@{/}" class="logo">
                <img
                        th:src="@{/assets/icon/logo.svg}"
                        alt="grocerystore"
                        class="logo__img"
                />
                <h1 class="logo__title">grocerystore</h1>
            </a>
            <h1 class="auth__heading">Đăng ký</h1>
            <p class="auth__desc">
                Tạo tài khoản để mua sắm thông minh và tiết kiệm hơn.
            </p>
            <!-- Alert messages -->
            <div th:if="${errorMessage}" class="alert alert--error"
                 style="color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 8px; margin-bottom: 16px;">
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert alert--success"
                 style="color: #155724; background: #d4edda; padding: 10px; border-radius: 8px; margin-bottom: 16px;">
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="form auth__form">
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="text"
                                th:field="*{username}"
                                class="form__input"
                                placeholder="Tên đăng nhập"
                                required
                                autofocus
                        />
                        <img
                                th:src="@{/assets/icon/email.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Lỗi tên đăng nhập</p>
                </div>
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="email"
                                th:field="*{email}"
                                class="form__input"
                                placeholder="Email"
                                required
                        />
                        <img
                                th:src="@{/assets/icon/email.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi email</p>
                </div>
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="text"
                                th:field="*{fullName}"
                                class="form__input"
                                placeholder="Họ và tên (tùy chọn)"
                        />
                        <img
                                th:src="@{/assets/icon/email.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                    </div>
                </div>
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="password"
                                th:field="*{password}"
                                class="form__input"
                                placeholder="Mật khẩu"
                                required
                                minlength="6"
                        />
                        <img
                                th:src="@{/assets/icon/lock.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Lỗi mật khẩu</p>
                </div>
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="password"
                                th:field="*{confirmPassword}"
                                class="form__input"
                                placeholder="Xác nhận mật khẩu"
                                required
                                minlength="6"
                        />
                        <img
                                th:src="@{/assets/icon/lock.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error" th:if="${#fields.hasErrors('confirmPassword')}"
                       th:errors="*{confirmPassword}">Lỗi xác nhận mật khẩu</p>
                </div>
                <div class="form__group form__group--inline">
                    <label class="form__checkbox">
                        <input type="checkbox" name="agreeTerms" class="form__checkbox-input" required/>
                        <span class="form__checkbox-label">Tôi đồng ý với điều khoản sử dụng</span>
                    </label>
                </div>
                <div class="form__group auth__btn-group">
                    <button type="submit" class="btn btn--primary auth__btn form__submit-btn">
                        Đăng ký
                    </button>
                </div>
            </form>

            <!-- Google Login Button (Ngoài form để tránh submit) -->
            <div class="form__group auth__btn-group" style="margin-top: 16px;">
                <a th:href="@{/oauth2/authorization/google}" class="btn btn--outline auth__btn btn--no-margin"
                   style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; width: 100%;">
                    <img
                            th:src="@{/assets/icon/google.svg}"
                            alt=""
                            class="btn-icon icon"
                    />
                    Đăng nhập với Google
                </a>
            </div>

            <p class="auth__text">
                Đã có tài khoản?
                <a th:href="@{/sign-in}" class="auth__link">Đăng nhập</a>
            </p>
        </div>
    </div>
</main>
<script>
    window.dispatchEvent(new Event("template-loaded"));
</script>
</body>
</html>
