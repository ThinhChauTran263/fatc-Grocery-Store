<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/fragments/head :: head('Đặt lại mật khẩu - Grocery Store')}"></head>
<link rel="stylesheet" th:href="@{/assets/css/auth.css}"/>
<body>
<main class="auth">
    <!-- Auth intro -->
    <div class="auth__intro d-md-none">
        <img
                th:src="@{/assets/img/auth/forgot-password.png}"
                alt=""
                class="auth__intro-img"
                style="--width: 424px"
        />
    </div>

    <!-- Auth content -->
    <div class="auth__content">
        <div class="auth__content-inner">
            <a th:href="@{/}" class="logo">
                <img
                        th:src="@{/assets/icon/logo.svg}"
                        alt="grocerystore"
                        class="logo__img"
                />
                <h2 class="logo__title">grocerystore</h2>
            </a>
            <h1 class="auth__heading">Đặt lại mật khẩu</h1>
            <p class="auth__desc">
                Nhập thông tin tài khoản và mật khẩu hiện tại để xác thực, sau đó đặt mật khẩu mới.
            </p>
            
            <!-- Success message -->
            <div th:if="${successMessage}" class="alert alert--success"
                 style="color: #155724; background: #d4edda; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid #28a745;">
                ✅ <span th:text="${successMessage}"></span>
            </div>
            
            <!-- Error message -->
            <div th:if="${errorMessage}" class="alert alert--error"
                 style="color: #dc3545; background: #f8d7da; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid #dc3545;">
                ❌ <span th:text="${errorMessage}"></span>
            </div>
            
            <form
                    th:action="@{/auth/reset-password}"
                    method="post"
                    class="form auth__form"
            >
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="text"
                                name="usernameOrEmail"
                                id="usernameOrEmail"
                                placeholder="Tên đăng nhập hoặc Email"
                                class="form__input"
                                required
                                autofocus
                        />
                        <img
                                th:src="@{/assets/icon/profile.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error">Vui lòng nhập tên đăng nhập hoặc email</p>
                </div>
                
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="password"
                                name="currentPassword"
                                id="currentPassword"
                                placeholder="Mật khẩu hiện tại"
                                class="form__input"
                                required
                        />
                        <img
                                th:src="@{/assets/icon/lock.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error">Vui lòng nhập mật khẩu hiện tại</p>
                </div>
                
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="password"
                                name="newPassword"
                                id="newPassword"
                                placeholder="Mật khẩu mới (tối thiểu 6 ký tự)"
                                class="form__input"
                                required
                                minlength="6"
                        />
                        <img
                                th:src="@{/assets/icon/lock.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error">Mật khẩu phải có ít nhất 6 ký tự</p>
                </div>
                
                <div class="form__group">
                    <div class="form__text-input">
                        <input
                                type="password"
                                name="confirmPassword"
                                id="confirmPassword"
                                placeholder="Xác nhận mật khẩu mới"
                                class="form__input"
                                required
                                minlength="6"
                        />
                        <img
                                th:src="@{/assets/icon/lock.svg}"
                                alt=""
                                class="form__input-icon"
                        />
                        <img
                                th:src="@{/assets/icon/error.svg}"
                                alt=""
                                class="form__input-icon-error"
                        />
                    </div>
                    <p class="form__error">Vui lòng xác nhận mật khẩu</p>
                </div>
                
                <div class="form__group auth__btn-group">
                    <button type="submit" class="btn btn--primary auth__btn form__submit-btn">
                        Đặt lại mật khẩu
                    </button>
                </div>
            </form>

            <p class="auth__text" style="margin-top: 24px;">
                <a th:href="@{/sign-in}" class="auth__link auth__text-link"
                   style="color: #0071dc; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;"
                   onmouseover="this.style.color='#004c91'"
                   onmouseout="this.style.color='#0071dc'"
                >← Quay lại đăng nhập</a>
            </p>
        </div>
    </div>
</main>
<script>
    window.dispatchEvent(new Event("template-loaded"));
</script>
</body>
</html>
