<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Navbar Fragment -->
<nav th:fragment="navbar" id="navbar" class="navbar hide">
    <button class="navbar__close-btn js-toggle" toggle-target="#navbar">
        <img th:src="@{/assets/icon/arrow-left.svg}" alt="" class="icon" />
    </button>

    <a th:href="@{/checkout}" class="nav-btn d-none">
        <img th:src="@{/assets/icon/buy.svg}" alt="" class="icon nav-btn__icon" />
        <span class="nav-btn__title">Cart</span>
        <span class="nav-btn__qnt">3</span>
    </a>

    <a href="#!" class="nav-btn d-none">
        <img th:src="@{/assets/icon/heart.svg}" alt="" class="icon nav-btn__icon" />
        <span class="nav-btn__title">Favorite</span>
        <span class="nav-btn__qnt">3</span>
    </a>

    <!-- Search Bar in Navbar -->
    <div class="navbar__search">
        <form th:action="@{/category}" method="get" class="navbar__search-form">
            <input type="text" 
                   name="keyword" 
                   placeholder="Tìm kiếm sản phẩm..." 
                   class="navbar__search-input"
                   th:value="${keyword}">
            <button type="submit" class="navbar__search-btn">
                <img th:src="@{/assets/icon/search.svg}" alt="Search" class="icon" />
            </button>
        </form>
    </div>

    <ul class="navbar__list js-dropdown-list">
        <!-- Tất cả sản phẩm -->
        <li class="navbar__item">
            <a th:href="@{/products}" class="navbar__link navbar__link--primary">
                <img th:src="@{/assets/icon/bag.svg}" alt="" class="icon navbar__icon" />
                Tất cả sản phẩm
            </a>
        </li>

        <!-- Caffeine Calculator -->
        <li class="navbar__item">
            <a th:href="@{/cc-doctor}" class="navbar__link">
                <img th:src="@{/assets/icon/document.svg}" alt="" class="icon navbar__icon" />
                Caffeine Calculator
            </a>
        </li>

        <!-- Departments - Ẩn (đang phát triển) -->

        <li class="navbar__item">
            <a href="#!" class="navbar__link">
                Departments
                <img th:src="@{/assets/icon/arrow-down.svg}" alt="" class="icon navbar__arrow" />
            </a>
            <div th:replace="~{shared/fragments/header/dropdown-departments :: dropdownDepartments}"></div>
        </li>
        -->

        <!-- Grocery - Ẩn (đang phát triển) -->

            <a href="#!" class="navbar__link">
                Grocery
                <img th:src="@{/assets/icon/arrow-down.svg}" alt="" class="icon navbar__arrow" />
            </a>
            <div th:replace="~{shared/fragments/header/dropdown-grocery :: dropdownGrocery}"></div>
        </li>
        -->

        <!-- Beauty - Ẩn (đang phát triển) -->
        <!--

            <a href="#!" class="navbar__link">
                Beauty
                <img th:src="@{/assets/icon/arrow-down.svg}" alt="" class="icon navbar__arrow" />
            </a>
            <div th:replace="~{shared/fragments/header/dropdown-beauty :: dropdownBeauty}"></div>
        </li>
        -->
    </ul>
</nav>

</html>
